<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>حضور جيم</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#111827;font-family:Arial,Tahoma,sans-serif}.app{max-width:780px;margin:auto;padding:15px 13px 85px}
.head{display:flex;justify-content:space-between;align-items:center}.head h1{margin:0;font-size:25px}.muted{color:#6b7280;font-size:12px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:9px}.card{background:#fff;border-radius:16px;padding:15px;box-shadow:0 2px 12px #0001;margin-top:11px}.stat span{color:#6b7280;font-size:12px}.stat b{display:block;font-size:22px;margin-top:5px}
.tabs{position:fixed;bottom:0;left:0;right:0;height:68px;background:#fff;border-top:1px solid #e5e7eb;display:flex;z-index:20}.tabs button{flex:1;border:0;background:none;color:#6b7280;font-size:12px}.tabs button.active{color:#111827;font-weight:bold}
.section{display:none}.section.active{display:block}.datebar{display:flex;gap:8px;align-items:center}.datebar input{flex:1}
input{padding:11px;border:1px solid #ddd;border-radius:10px;background:#fff;font-size:15px;width:100%;margin:5px 0}button{border:0;border-radius:10px;padding:10px 13px;cursor:pointer}
.green{background:#16a34a;color:#fff}.blue{background:#2563eb;color:#fff}.dark{background:#111827;color:#fff}.red{background:#dc2626;color:#fff}.gray{background:#eef0f2}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 0;border-bottom:1px solid #eee}.name{font-weight:bold}.small{font-size:12px;color:#6b7280;margin-top:4px}.badge{padding:6px 9px;border-radius:20px;font-size:12px;background:#dcfce7;color:#15803d}
.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;width:300px;flex:0 0 300px}.actions button{white-space:nowrap;padding:9px 8px;font-size:13px;margin:0;width:100%}@media(max-width:560px){.row{align-items:flex-start}.row>.actions{width:270px;flex-basis:270px}.row>div:first-child{min-width:0}}.money{font-weight:bold}.due{color:#dc2626}.paid{color:#15803d}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:10px 3px;border-bottom:1px solid #eee;text-align:center}th{color:#6b7280}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:30}.modal.show{display:flex}.sheet{width:100%;background:#fff;border-radius:20px 20px 0 0;padding:20px;max-height:90vh;overflow:auto}.sheet form{display:grid;gap:8px}
.history{margin-top:12px}.history-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee}
@media(min-width:700px){.modal{align-items:center}.sheet{max-width:540px;margin:auto;border-radius:18px}}
</style></head>
<body><div class="app">
<header class="head"><div><h1>حضور جيم 🏋️</h1><div class="muted">الحضور • الحساب • المدفوعات</div></div><button class="gray" onclick="settings()">⚙️</button></header>

<div class="cards">
<div class="card stat"><span>المتدربين</span><b id="count">0</b></div>
<div class="card stat"><span>حضور اليوم</span><b id="today">0</b></div>
<div class="card stat"><span>المطلوب هذا الشهر</span><b id="required">0 ج</b></div>
<div class="card stat"><span>المتبقي للتحصيل</span><b id="due">0 ج</b></div>
</div>

<section id="home" class="section active"><div class="card">
<div class="datebar"><b>حضور يوم:</b><input id="date" type="date" onchange="render()"></div><div id="attendanceList"></div>
</div></section>

<section id="reportSection" class="section"><div class="card"><h3>تقرير الشهر</h3><div class="muted" id="monthLabel"></div>
<table><thead><tr><th>المتدرب</th><th>حضر</th><th>المطلوب</th><th>دفع</th><th>المتبقي / الرصيد</th></tr></thead><tbody id="report"></tbody></table></div></section>

<section id="people" class="section"><div class="card"><button class="blue" onclick="openAdd()">+ إضافة متدرب</button><input id="search" placeholder="ابحث عن متدرب..." oninput="renderPeople()"><div id="peopleList"></div></div>
<div class="card"><div class="actions"><button class="dark" onclick="backup()">📦 Backup</button><button onclick="document.getElementById('restore').click()">📥 Restore</button><input id="restore" type="file" accept=".json" style="display:none" onchange="restore(event)"></div></div></section>
</div>

<nav class="tabs"><button class="active" onclick="tab('home',this)">🏠<br>الحضور</button><button onclick="tab('reportSection',this)">📊<br>التقرير</button><button onclick="tab('people',this)">👥<br>المتدربين</button></nav>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>

<script>
const KEY='gym_attendance_v3';
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{
 trainees:[
  {id:1,name:'أحمد محمد',agreed:12,price:100},
  {id:2,name:'محمد علي',agreed:8,price:150},
  {id:3,name:'عمر حسن',agreed:12,price:100},
  {id:4,name:'علي محمود',agreed:10,price:120}
 ],attendance:[],payments:[]
};
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
const today=()=>document.getElementById('date').value, month=()=>today().slice(0,7);
const money=n=>Number(n).toLocaleString('ar-EG')+' ج';
const count=(id,m)=>state.attendance.filter(a=>a.traineeId===id&&a.date.startsWith(m)).length;
const paid=(id,m)=>state.payments.filter(p=>p.traineeId===id&&p.date.startsWith(m)).reduce((s,p)=>s+p.amount,0);
const present=(id,d)=>state.attendance.some(a=>a.traineeId===id&&a.date===d);
document.getElementById('date').value=new Date().toISOString().slice(0,10);

function render(){
 let m=month(),d=today(), rows=state.trainees.map(t=>{let c=count(t.id,m),r=c*t.price,p=paid(t.id,m);return {t,c,r,p,due:Math.max(0,r-p)}});
 document.getElementById('count').textContent=state.trainees.length;
 document.getElementById('today').textContent=state.attendance.filter(a=>a.date===d).length;
 document.getElementById('required').textContent=money(rows.reduce((s,x)=>s+x.r,0));
 document.getElementById('due').textContent=money(rows.reduce((s,x)=>s+x.due,0));
 document.getElementById('monthLabel').textContent='الشهر: '+m;
 document.getElementById('attendanceList').innerHTML=state.trainees.map(t=>{let c=count(t.id,m),p=present(t.id,d);return `<div class="row"><div><div class="name">${t.name}</div><div class="small">${c} / ${t.agreed} سيشن • ${money(t.price)} للسيشن</div></div>${p?'<div><span class="badge">✓ حاضر</span> <button class="gray" onclick="undo('+t.id+')">تراجع</button></div>':'<button class="green" onclick="mark('+t.id+')">حضر</button>'}</div>`}).join('')||'<div class="small">مفيش متدربين</div>';
 document.getElementById('report').innerHTML=rows.map(x=>{let diff=x.r-x.p;let cell=diff>0?`<span class="due">متبقي ${money(diff)}</span>`:diff<0?`<span class="paid">رصيد ${money(Math.abs(diff))}</span>`:`<span class="paid">0 ج</span>`;return `<tr><td>${x.t.name}</td><td>${x.c}</td><td>${money(x.r)}</td><td class="paid">${money(x.p)}</td><td>${cell}</td></tr>`}).join('');
 renderPeople();save();
}
function mark(id){let d=today();if(!present(id,d)){state.attendance.push({traineeId:id,date:d});render()}}
function undo(id){let d=today();state.attendance=state.attendance.filter(a=>!(a.traineeId===id&&a.date===d));render()}
function renderPeople(){
 let q=(document.getElementById('search')?.value||'').trim().toLowerCase();
 let list=state.trainees.filter(t=>t.name.toLowerCase().includes(q));
 document.getElementById('peopleList').innerHTML=list.map(t=>{let c=count(t.id,month()),r=c*t.price,p=paid(t.id,month()),diff=r-p;
let status=diff>0?`<span class="due">متبقي ${money(diff)}</span>`:diff<0?`<span class="paid">رصيد ${money(Math.abs(diff))}</span>`:`<span class="paid">متبقي 0 ج</span>`;
return `<div class="row"><div><div class="name">${t.name}</div><div class="small">${c} سيشن • مطلوب ${money(r)} • مدفوع ${money(p)} • ${status}</div></div><div class="actions"><button class="blue" onclick="openPayment(${t.id})">دفع</button><button onclick="profile(${t.id})">عرض</button><button class="red" onclick="del(${t.id})">حذف</button></div></div>`}).join('')||'<div class="small">لا يوجد نتائج</div>';
}
function openAdd(){document.getElementById('sheet').innerHTML=`<h2>إضافة متدرب</h2><form onsubmit="add(event)"><input id="n" required placeholder="اسم المتدرب"><input id="a" type="number" min="1" value="12" required placeholder="عدد السيشن"><input id="p" type="number" min="1" value="100" required placeholder="سعر السيشن"><button class="blue">حفظ</button><button type="button" onclick="closeModal()">إلغاء</button></form>`;document.getElementById('modal').classList.add('show')}
function add(e){e.preventDefault();state.trainees.push({id:Date.now(),name:n.value.trim(),agreed:+a.value,price:+p.value});closeModal();render()}
function openPayment(id){
 let t=state.trainees.find(x=>x.id===id),m=month(),r=count(id,m)*t.price,p=paid(id,m),d=Math.max(0,r-p);
 document.getElementById('sheet').innerHTML=`<h2>تسجيل دفعة — ${t.name}</h2><p>المطلوب هذا الشهر: <b>${money(r)}</b></p><p>المدفوع: <b class="paid">${money(p)}</b></p><p>المتبقي: <b class="${d?'due':'paid'}">${money(d)}</b></p><form onsubmit="pay(event,${id})"><label>قيمة الدفعة</label><input id="amount" type="number" min="1" required placeholder="مثال: 300"><label>تاريخ الدفع</label><input id="paydate" type="date" value="${today()}" required><button class="blue">تسجيل الدفعة</button><button type="button" onclick="closeModal()">إلغاء</button></form>`;
 document.getElementById('modal').classList.add('show');
}
function pay(e,id){e.preventDefault();let amount=+document.getElementById('amount').value,date=document.getElementById('paydate').value;state.payments.push({id:Date.now(),traineeId:id,amount,date});closeModal();render()}
function profile(id){
 let t=state.trainees.find(x=>x.id===id),m=month(),h=state.attendance.filter(a=>a.traineeId===id).sort((a,b)=>b.date.localeCompare(a.date)),ps=state.payments.filter(p=>p.traineeId===id).sort((a,b)=>b.date.localeCompare(a.date)),r=count(id,m)*t.price,p=paid(id,m),diff=r-p;
let status=diff>0?`<span class="due">المتبقي: ${money(diff)}</span>`:diff<0?`<span class="paid">الرصيد: ${money(Math.abs(diff))}</span>`:`<span class="paid">المتبقي: 0 ج</span>`;
 document.getElementById('sheet').innerHTML=`<h2>${t.name}</h2><p>${t.agreed} سيشن • ${money(t.price)} للسيشن</p><p>حضر هذا الشهر: <b>${count(id,m)}</b> • المطلوب: <b>${money(r)}</b></p><p>المدفوع: <b class="paid">${money(p)}</b> • ${status}</p><button class="blue" onclick="openPayment(${id})">+ تسجيل دفعة</button><h3>دفعات هذا الشهر</h3><div class="history">${ps.length?ps.map(x=>`<div class="history-item"><span>${x.date} — ${money(x.amount)}</span><button class="red" onclick="removePayment(${x.id},${id})">حذف</button></div>`).join(''):'لا توجد دفعات'}</div><h3>تاريخ الحضور</h3><div class="history">${h.length?h.map(x=>`<div class="history-item"><span>${x.date}</span><button class="red" onclick="removeAttendance(${x.traineeId},'${x.date}')">حذف</button></div>`).join(''):'لا يوجد حضور'}</div><br><button onclick="closeModal()">إغلاق</button>`;
 document.getElementById('modal').classList.add('show');
}
function removePayment(pid,tid){state.payments=state.payments.filter(p=>p.id!==pid);profile(tid);render()}
function removeAttendance(id,date){state.attendance=state.attendance.filter(a=>!(a.traineeId===id&&a.date===date));profile(id);render()}
function del(id){if(confirm('متأكد إنك عايز تحذف المتدرب وكل الحضور والمدفوعات؟')){state.trainees=state.trainees.filter(t=>t.id!==id);state.attendance=state.attendance.filter(a=>a.traineeId!==id);state.payments=state.payments.filter(p=>p.traineeId!==id);render()}}
function tab(id,b){document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='gym-attendance-backup.json';a.click()}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.trainees||!x.attendance||!x.payments)throw 0;state=x;render();alert('تم استرجاع البيانات ✅')}catch{alert('ملف Backup غير صحيح')}};r.readAsText(f)}
function settings(){document.getElementById('sheet').innerHTML='<h2>إعدادات</h2><p>البيانات محفوظة على هذا الجهاز.</p><p>الدفع مربوط بالشهر، والدفعات القديمة لا تدخل في حساب شهر جديد.</p><p>اعمل Backup بشكل دوري.</p><button onclick="closeModal()">تمام</button>';document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js?v=5');render();
</script></body></html>
